# The portable role-skill registry: the roles and skills every installation gets, delivered into
# the shell roots below by `ummanu role-skills sync`.
#
# An installation may own a second manifest at `<instance>/skills/manifest.toml` whose skills sit
# in the `roles/` tree beside it; those entries are layered over these (ummanu/role_skills.py).
# Anything that only makes sense on one host belongs there, not here.
#
# Target roots are written home-relative on purpose: the product does not know which user runs it,
# and a root is expanded against the home of the installation the sync runs for. A root starting
# with `@po/` is inside the product owner's workspace, `<data_dir>/po`, of the installation instead.
#
# A skill entry `<role>/<skill>` delivers a skill another role declares, from that role's tree, so a
# skill two roles share still has one source.

[roles.ummanu]
skills = [
  "open-sprint",
  "knowledge-doc",
  "grilling",
  "grill-me",
  "thermo-nuclear-code-quality-review",
]

[roles.curator]
skills = ["curate"]

# The product owner head, which runs with its workspace in the data directory as cwd.
[roles.po]
skills = ["ummanu/open-sprint", "open-issue", "ummanu/grilling", "ummanu/knowledge-doc"]

[roles.retro]
skills = ["retro"]

[roles.steward]
skills = ["steward"]

# The sprint observer head. Which profile runs is the sprint's own `sprint_observer` field, not a
# role default, so this is delivered to the shells of every profile a sprint may declare rather than
# to one chosen shell. The dispatcher refuses to launch a head into a shell without this skill.
[roles.observer]
skills = ["observe-sprint"]

[targets.claude-ummanu-global]
shell = "claude"
root = "~/.claude/skills"
roles = ["ummanu"]

[targets.codex-orca-ummanu]
shell = "codex"
root = "~/.config/orca/codex-runtime-home/home/skills"
roles = ["ummanu"]

[targets.hermes-secretary]
shell = "hermes"
root = "~/.hermes/skills/secretary"
roles = ["ummanu"]

[targets.claude-ummanu-curator]
shell = "claude"
root = "~/orca/workspaces/ummanu/curator/.claude/skills"
roles = ["curator"]

[targets.claude-ummanu-retro]
shell = "claude"
root = "~/orca/workspaces/ummanu/retro/.claude/skills"
roles = ["retro"]

[targets.claude-ummanu-steward]
shell = "claude"
root = "~/orca/workspaces/ummanu/steward/.claude/skills"
roles = ["steward"]

[targets.claude-ummanu-observer]
shell = "claude"
# The observer's workspace is created per sprint, so its skill cannot be delivered into a fixed
# workspace the way curator, retro and steward are. It goes to the shell-wide root instead, which
# is where a claude observer head will look for it whatever sprint it comes up on.
root = "~/.claude/skills"
roles = ["observer"]

[targets.codex-ummanu-roles]
shell = "codex"
root = "~/.config/orca/codex-runtime-home/home/skills"
roles = ["curator", "retro", "steward", "observer"]

# A Codex head runs with CODEX_HOME=<data_dir>/codex-home, so the Orca home above is not on its skill
# path. What it does read is `.agents/skills` in its cwd, so each fixed-workspace role gets its skill
# there, the way its claude head gets `.claude/skills`.
[targets.codex-ummanu-curator]
shell = "codex"
root = "~/orca/workspaces/ummanu/curator/.agents/skills"
roles = ["curator"]

[targets.codex-ummanu-retro]
shell = "codex"
root = "~/orca/workspaces/ummanu/retro/.agents/skills"
roles = ["retro"]

[targets.codex-ummanu-steward]
shell = "codex"
root = "~/orca/workspaces/ummanu/steward/.agents/skills"
roles = ["steward"]

[targets.hermes-secretary-roles]
shell = "hermes"
root = "~/.hermes/skills/secretary-roles"
roles = ["curator", "retro", "steward"]

# Claude Code reads project skills from `.claude/skills` in its cwd; Codex 0.154 reads `.agents/skills`
# there, git repository or not.
[targets.claude-po-workspace]
shell = "claude"
root = "@po/.claude/skills"
roles = ["po"]

[targets.codex-po-workspace]
shell = "codex"
root = "@po/.agents/skills"
roles = ["po"]

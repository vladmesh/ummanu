name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# CI installs the checked-out candidate into its selected Python rather than into the production
# systemd layout. Register that checkout explicitly so runtime-provenance tests exercise the same
# interpreter/root invariant without falling back to the runner user's nonexistent ~/ummanu.
env:
  UMMANU_REPO: ${{ github.workspace }}
  # Suppress ONNX Runtime telemetry before Python imports can initialize its uploader.
  ORT_DISABLE_TELEMETRY: "1"

# A newer push to a pull request supersedes the run for its previous head. Every other run (a push
# to main, a manual dispatch) is its own group, so it is never cancelled or held behind another.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  selection:
    name: CI selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.select.outputs.suites }}
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Select exact-event test modules
        id: select
        run: >-
          python3 scripts/ci_test_shards.py --select
          --selection-plan "$RUNNER_TEMP/ci-selection/plan.json"
          --candidate-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --base-sha "${{ github.event.pull_request.base.sha }}"
          --event "${{ github.event_name }}" --event-ref "${{ github.ref }}"
          >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-selection-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ci-selection/plan.json
          if-no-files-found: error
          retention-days: 14

  test_suites:
    needs: selection
    if: ${{ needs.selection.result == 'success' && needs.selection.outputs.mode != 'docs-only' }}
    name: test / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.selection.outputs.suites || '["unit"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The migration compatibility proof runs the actual pre-migration source tree.
          fetch-depth: 0
      - name: Download exact-SHA selection plan
        uses: actions/download-artifact@v4
        with:
          name: ci-selection-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ci-selection
      - uses: ./.github/actions/python-setup
        with:
          extras: ${{ matrix.suite == 'unit' && 'ci,dev' || 'memory,ci' }}
      - name: Run the hermetic fast profile
        if: ${{ matrix.suite == 'unit' && needs.selection.outputs.mode == 'full' }}
        run: python3 scripts/ci_test_shards.py --fast
      - name: Pull the throwaway PostgreSQL image before any suite needs it
        # The card-store fixtures pull `postgres:16` from inside a test; a Docker Hub hiccup there
        # reads as a red product test. Pull it up front, with retries, so the pull either succeeds
        # or fails in a step of its own that the gate classifies as infrastructure.
        if: >-
          ${{ contains(fromJSON('["integration-board", "integration-dispatcher", "integration-heads", "integration-recovery"]'), matrix.suite) }}
        run: |
          for attempt in 1 2 3 4; do
            if docker pull --quiet postgres:16; then exit 0; fi
            echo "pull image postgres:16 failed (attempt $attempt), retrying"
            sleep 15
          done
          echo "pull image postgres:16 failed after 4 attempts"
          exit 1
      - name: Run reported suite
        id: run_suite
        continue-on-error: true
        run: >-
          mkdir -p "$RUNNER_TEMP/ci-coverage/${{ matrix.suite }}"
          &&
          python3 -m coverage run
          --data-file "$RUNNER_TEMP/ci-coverage/${{ matrix.suite }}/coverage.${{ matrix.suite }}"
          scripts/ci_test_shards.py --suite "${{ matrix.suite }}"
          --report-dir "$RUNNER_TEMP/ci-evidence/${{ matrix.suite }}"
          --candidate-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --selection-plan "$RUNNER_TEMP/ci-selection/plan.json"
          --base-sha "${{ github.event.pull_request.base.sha }}"
          --event "${{ github.event_name }}" --event-ref "${{ github.ref }}"
      - name: Write suite evidence summary
        if: ${{ always() }}
        continue-on-error: true
        run: >-
          python3 scripts/ci_test_shards.py --summary
          --report-dir "$RUNNER_TEMP/ci-evidence/${{ matrix.suite }}"
          >> "$GITHUB_STEP_SUMMARY"
      - name: Upload suite JUnit and bounded log
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ matrix.suite }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ci-evidence/${{ matrix.suite }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload raw suite coverage
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-coverage-${{ matrix.suite }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ci-coverage/${{ matrix.suite }}/coverage.${{ matrix.suite }}
          if-no-files-found: error
          retention-days: 14
      - name: Preserve suite result
        if: ${{ always() }}
        run: >-
          python3 scripts/ci_test_shards.py --summary
          --report-dir "$RUNNER_TEMP/ci-evidence/${{ matrix.suite }}"
          > /dev/null

  typecheck:
    needs: selection
    if: ${{ needs.selection.result == 'success' && needs.selection.outputs.mode != 'docs-only' }}
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/python-setup
        with:
          extras: typecheck
      - run: python3 -m mypy

  lint:
    needs: selection
    if: ${{ needs.selection.result == 'success' && needs.selection.outputs.mode != 'docs-only' }}
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/python-setup
        with:
          extras: dev
      - name: Check changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 scripts/ci_lint.py --base-sha "$BASE_SHA" --candidate-sha "$CANDIDATE_SHA"

  test:
    name: test
    if: ${{ always() }}
    needs: [selection, test_suites, typecheck, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Download exact-SHA selection plan
        uses: actions/download-artifact@v4
        with:
          name: ci-selection-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ci-selection
      - uses: ./.github/actions/python-setup
        with:
          extras: ci
      - name: Download suite evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ci-evidence-*
          path: ${{ runner.temp }}/ci-evidence
          merge-multiple: false
      - name: Download raw suite coverage
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ci-coverage-*
          path: ${{ runner.temp }}/ci-coverage
          merge-multiple: false
      - name: Combine exact-SHA coverage evidence
        id: coverage_aggregate
        if: ${{ always() }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 scripts/ci_test_shards.py --coverage-aggregate
          --coverage-dir "$RUNNER_TEMP/ci-coverage"
          --coverage-output-dir "$RUNNER_TEMP/ci-coverage-combined"
          --candidate-sha "$CANDIDATE_SHA"
          --base-sha "$BASE_SHA"
          --selection-plan "$RUNNER_TEMP/ci-selection/plan.json"
          --event "${{ github.event_name }}" --event-ref "${{ github.ref }}"
          >> "$GITHUB_STEP_SUMMARY"
      - name: Upload combined coverage evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-coverage-combined-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ci-coverage-combined
          if-no-files-found: warn
          retention-days: 14
      - name: Require and classify every test suite
        id: suite_aggregate
        if: ${{ always() }}
        continue-on-error: true
        env:
          SUITES_RESULT: ${{ needs.test_suites.result }}
        run: >-
          python3 scripts/ci_test_shards.py --aggregate
          --evidence-dir "$RUNNER_TEMP/ci-evidence"
          --needs-result "$SUITES_RESULT"
          --selection-plan "$RUNNER_TEMP/ci-selection/plan.json"
          --candidate-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --base-sha "${{ github.event.pull_request.base.sha }}"
          --event "${{ github.event_name }}" --event-ref "${{ github.ref }}"
          >> "$GITHUB_STEP_SUMMARY"
      - name: Publish main coverage baseline
        if: >-
          ${{ github.ref == 'refs/heads/main' && steps.coverage_aggregate.outcome == 'success' &&
          steps.suite_aggregate.outcome == 'success' && needs.typecheck.result == 'success' &&
          needs.lint.result == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-coverage-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/ci-coverage-combined
          if-no-files-found: error
          retention-days: 90
      - name: Write main coverage baseline summary
        if: >-
          ${{ github.ref == 'refs/heads/main' && steps.coverage_aggregate.outcome == 'success' &&
          steps.suite_aggregate.outcome == 'success' && needs.typecheck.result == 'success' &&
          needs.lint.result == 'success' }}
        env:
          BASELINE_SHA: ${{ github.sha }}
          BASELINE_ARTIFACT: ci-coverage-baseline-${{ github.sha }}
        run: >-
          printf '## Main coverage baseline\n\n- Candidate SHA: `%s`\n- Artifact: `%s`\n'
          "$BASELINE_SHA" "$BASELINE_ARTIFACT" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve required aggregate result
        if: ${{ always() }}
        env:
          JOB_RESULTS: >-
            {"selection":"${{ needs.selection.result }}","test_suites":"${{ needs.test_suites.result }}",
            "typecheck":"${{ needs.typecheck.result }}","lint":"${{ needs.lint.result }}"}
        run: >-
          test "${{ steps.coverage_aggregate.outcome }}" = success
          && test "${{ steps.suite_aggregate.outcome }}" = success
          && python3 scripts/ci_test_shards.py --validation-aggregate
          --selection-plan "$RUNNER_TEMP/ci-selection/plan.json"
          --candidate-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --base-sha "${{ github.event.pull_request.base.sha }}"
          --event "${{ github.event_name }}" --event-ref "${{ github.ref }}"
          --job-results "$JOB_RESULTS"

name: task-protocol-graph

on:
  pull_request:
    paths:
      - src/ummanu/dispatch/host.py
      - src/ummanu/dispatch/host_runtime/**
      - src/ummanu/dispatch/gate.py
      - src/ummanu/dispatch/gate_types.py
      - src/ummanu/dispatch/github_ci.py
      - src/ummanu/dispatch/gate_pr.py
      - src/ummanu/dispatch/gate_workflows.py
      - src/ummanu/dispatch/gate_lifecycle.py
      - src/ummanu/dispatch/e2e.py
      - src/ummanu/dispatch/e2e_stage.py
      - src/ummanu/dispatch/e2e_after_merge.py
      - src/ummanu/dispatch/post_merge.py
      - src/ummanu/dispatch/wait_cards.py
      - tests/test_gate_owners.py
      - tests/support/gate_owners.py
      - tests/test_host_owners.py
      - tests/support/host_owners.py
      - tests/config_dependencies.py
      - src/ummanu/board/models.py
      - src/ummanu/board/attempt_outcome.py
      - tests/test_attempt_outcome_payload.py
      - src/ummanu/board/fake.py
      - tests/fakes/board.py
      - tests/test_architecture.py
      - src/ummanu/dispatch/claim.py
      - src/ummanu/dispatch/cleanup.py
      - src/ummanu/dispatch/head_status.py
      - src/ummanu/dispatch/worker_report.py
      - src/ummanu/dispatch/worker_continuation.py
      - src/ummanu/tasks.py
      - src/ummanu/sprints.py
      - src/ummanu/board/sprint_protocol/**
      - tests/test_observer_voice.py
      - tests/test_sprint_read.py
      - tests/test_sprint_lifecycle_owners.py
      - tests/test_cleanup_foundation.py
      - tests/support/sprint_lifecycle_owners.py
      - src/ummanu/board/task_protocol/**
      - tests/fixtures/task_protocol_coupling.py.txt
      - .github/workflows/task-protocol-graph.yml
      - src/ummanu/board/owner_event_commands.py
      - src/ummanu/check_commands.py
      - src/ummanu/cli.py
      - src/ummanu/data.py
      - src/ummanu/dispatch/commands.py
      - src/ummanu/infra/doctor_record.py
      - src/ummanu/installation/commands.py
      - src/ummanu/po/commands.py
      - src/ummanu/po/service.py
      - src/ummanu/product_issue_commands.py
      - src/ummanu/restore_commands.py
      - src/ummanu/runtime/paths.py
      - src/ummanu/runtime/local_pty_*.py
      - tests/test_local_pty_backend_owners.py
      - tests/support/local_pty_owners.py
      - src/ummanu/secret_commands.py
      - src/ummanu/sprint_commands.py
      - src/ummanu/task_commands.py
      - src/ummanu/upgrade.py
      - src/ummanu/web/commands.py
      - src/ummanu/webfront/commands.py
      - src/ummanu/webproto/commands.py
      - src/ummanu/runtime/cli_composition.py
      - src/ummanu/infra/doctor_provider.py
      # Candidate-only parser/import regressions exercise the composition edges.
      - tests/test_cli_cold_composition.py
      - src/ummanu/runtime/procfs.py
      - src/ummanu/runtime/test_guard.py
      - src/ummanu/runtime/head/identity.py
      - src/ummanu/runtime/head/children.py
      - src/ummanu/runtime/head/local_pty/scoped_lifecycle.py
      - src/ummanu/runtime/head/local_pty/supervisor.py
      - src/ummanu/runtime/state.py
      - src/ummanu/po/runner.py
      - src/ummanu/host_apply.py
      - tests/test_procfs.py
      - tests/test_test_guard_interpreters.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify frozen research source
        run: python3 -c "import hashlib,pathlib; assert hashlib.sha256(pathlib.Path('tests/fixtures/task_protocol_coupling.py.txt').read_bytes()).hexdigest() == 'd2babc8963c011ea57eed9816eee28552ece76e6885955043a3721e65bd55cce'"
      - name: Measure exact candidate with the original uncut coupling model
        run: >-
          mkdir -p "$RUNNER_TEMP/task-protocol-graph"
          && python3 -I tests/fixtures/task_protocol_coupling.py.txt
          --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/task-protocol-graph"
          --cache "$RUNNER_TEMP/task-protocol-cache.pickle" graph --sha "$CANDIDATE_SHA"
      - name: Record original scanner SCC membership and config closure
        run: >-
          python3 -c "import json,os,pathlib,pickle,runpy;
          m=runpy.run_path('tests/fixtures/task_protocol_coupling.py.txt');
          repo=pathlib.Path.cwd(); sel=m['load_selector'](repo);
          snap=m['Snapshot'](sel,sel.snapshot(repo,os.environ['CANDIDATE_SHA']),pickle.loads(pathlib.Path(os.environ['RUNNER_TEMP']+'/task-protocol-cache.pickle').read_bytes()));
          graph,_=m['build_graph'](snap,set(),m['tier_none']);
          product={k:{v for v in values if v.startswith('ummanu')} for k,values in graph.items() if k.startswith('ummanu')};
          groups=sorted((sorted(g) for g in m['tarjan'](product) if len(g)>1),key=lambda g:(-len(g),g));
          config=sorted(n for n in m['closure_forward'](graph,'ummanu.config') if n.startswith('ummanu'));
          result={'sha':os.environ['CANDIDATE_SHA'],'source_modules':len([n for n in snap.modules if n.startswith('ummanu')]),'nodes':len(graph),'product_modules':len(product),'product_membership':sorted(product),'sccs':groups,'config_closure':config};
          pathlib.Path(os.environ['RUNNER_TEMP']+'/task-protocol-graph/uncut.json').write_text(json.dumps(result,indent=2));
          print(json.dumps(result,indent=2)); assert len(groups[0])<=60; assert len(config)<=10"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: task-protocol-graph-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/task-protocol-graph
          if-no-files-found: error

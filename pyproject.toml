[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.uv]
# This installation is managed by the product's venv/pip bootstrap and upgrade
# path. Keep incidental `uv run` invocations from creating a second dependency
# authority (`uv.lock`) or resynchronizing the production environment.
managed = false

[tool.ruff]
target-version = "py312"
# The linter is part of the contract, so its version is too: a rule set that means one thing
# on the author's machine and another in a gate is not a gate. `required-version` makes any
# other ruff refuse to run instead of silently reporting a different set of findings; install
# the matching one with `pip install -e '.[dev]'`.
required-version = "==0.16.4"
# The formatter's width, chosen from what the tree already is rather than from the default:
# p95 of the existing lines is 97 columns and p99 is 105, so 88 would rewrap working code for
# no reason. Long prose and command examples in comments and strings are not reflowed at all,
# which is why the lint side still ignores E501.
line-length = 110

[tool.ruff.lint]
# Keep the initial debt finite and explicit. These are the rules that find issues in
# the existing codebase; broad families add unrelated style churn before this debt is
# worked down.
select = [
    "B009", "B010", "B017", "B018", "B023",
    "BLE001",
    "C408", "C414",
    "DTZ003",
    "EXE001",
    "F401", "F541", "F811", "F821", "F841",
    "FLY002",
    "FURB105", "FURB162", "FURB167", "FURB188",
    "I001",
    "ISC004",
    "PERF101", "PERF102",
    "PIE810",
    "PLR0402", "PLW1510",
    "PYI034", "PYI041",
    "RUF010", "RUF012", "RUF015", "RUF022", "RUF059", "RUF100",
    "S110",
    "SIM102", "SIM117", "SIM401",
    "TRY004",
    "UP012", "UP017", "UP022", "UP031", "UP033", "UP034", "UP035", "UP037",
]

# `assert` is unittest's assertion API, and this project deliberately keeps long
# protocol prose and command examples intact instead of wrapping them for a column limit.
ignore = ["E501", "S101"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
# Start with typed leaves only. Imported legacy modules are followed for type information, but
# their existing debt is not promoted into this first gate; the checked set grows deliberately.
files = [
    "src/ummanu/board/models.py",
    "src/ummanu/board/roles.py",
    "src/ummanu/board/attempt_usage.py",
    "src/ummanu/board/attempt_outcome.py",
    "src/ummanu/board/outcome_round_context.py",
    "src/ummanu/board/card_transitions.py",
    "src/ummanu/board/task_routing.py",
    "src/ummanu/board/sprint_read.py",
    "src/ummanu/board/sprint_admission.py",
    "src/ummanu/board/sprint_write.py",
    "src/ummanu/board/sprint_close.py",
    "src/ummanu/board/host.py",
    "src/ummanu/board/backend.py",
    "src/ummanu/dispatch/runtime_provenance.py",
    "src/ummanu/dispatch/attempt_accounting.py",
    "src/ummanu/dispatch/assessment_decision.py",
    "src/ummanu/dispatch/claim.py",
    "src/ummanu/dispatch/gate_lifecycle.py",
    "src/ummanu/dispatch/review_verdict.py",
    "src/ummanu/dispatch/release_lifecycle.py",
    "src/ummanu/dispatch/worker_launch.py",
    "src/ummanu/dispatch/worker_report.py",
    "src/ummanu/dispatch/worker_continuation.py",
    "src/ummanu/dispatch/wait_vitality.py",
    "src/ummanu/routing_journal.py",
    "src/ummanu/dispatch/state.py",
    "src/ummanu/dispatch/pause.py",
    "src/ummanu/dispatch/runtime.py",
    "src/ummanu/po/models.py",
    "src/ummanu/runtime/__init__.py",
    "src/ummanu/runtime/paths.py",
    "src/ummanu/runtime/references.py",
    "src/ummanu/runtime/prompt_document.py",
    "src/ummanu/runtime/launch_prefix.py",
    "src/ummanu/runtime/shared_state.py",
    "src/ummanu/runtime/claude_sessions.py",
    "src/ummanu/runtime/claude_env.py",
    "src/ummanu/runtime/role_env.py",
    "src/ummanu/runtime/redact.py",
    "src/ummanu/runtime/resource_probe.py",
    "src/ummanu/runtime/provider_errors.py",
    "src/ummanu/dispatch/provider_failure.py",
    "src/ummanu/runtime/agent_prompt_transport.py",
    "src/ummanu/runtime/tui_delivery.py",
    "src/ummanu/runtime/head_runtimes.py",
    "src/ummanu/runtime/local_pty_head.py",
    "src/ummanu/runtime/head_runtime_backends.py",
    "src/ummanu/runtime/codex_preflight.py",
    "src/ummanu/runtime/state.py",
    "src/ummanu/runtime/heads.py",
    "src/ummanu/runtime/head/__init__.py",
    "src/ummanu/runtime/head/command.py",
    "src/ummanu/runtime/head/children.py",
    "src/ummanu/runtime/head/identity.py",
    "src/ummanu/runtime/head/operations.py",
    "src/ummanu/runtime/head/run.py",
    "src/ummanu/runtime/head/runtime.py",
    "src/ummanu/runtime/head/spec.py",
    "src/ummanu/runtime/head/task_ref.py",
    "src/ummanu/runtime/head/local_pty/__init__.py",
    "src/ummanu/runtime/head/local_pty/client.py",
    "src/ummanu/runtime/head/local_pty/journal.py",
    "src/ummanu/runtime/head/local_pty/protocol.py",
    "src/ummanu/runtime/head/local_pty/supervisor.py",
    "src/ummanu/automations/composition.py",
]
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
show_error_codes = true

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/ummanu"]

[project]
name = "ummanu"
version = "0.1.0"
description = "Single-owner ummanu appliance: a task board, dispatcher and agent heads on one host."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    # 4.18 is the first release whose validators take a `referencing` registry (its own
    # dependency from then on): ummanu/config.py resolves one bundled schema's `$ref` to
    # another through it.
    "jsonschema>=4.18",
    # ummanu/config.py also imports `referencing` itself to build that registry, so it is declared
    # rather than left to arrive through jsonschema. 0.28.4 is the floor jsonschema 4.18 requires.
    "referencing>=0.28.4",
    # The secret store is part of the product, not an extra: an installation that
    # cannot open its own secrets is not recoverable. 41.0 is the first release
    # with the AEAD and KDF surface ummanu/secret_store.py uses.
    "cryptography>=41.0",
    # The board store's driver, core for the same reason: an installation that
    # cannot reach its board is not degraded, it is non-functional (docs/BOARD_STORE.md §5.8).
    # The `binary` extra ships manylinux wheels that bundle libpq, so no libpq-dev, no compiler
    # and no apt step. A floor, not an equality pin, like the three above; ruff is equality-pinned
    # because a linter's version is part of a gate's meaning and a driver's is not. 3.3.6 is the
    # first release whose `Connection.wait` takes a `timeout`: the board client passes it on every
    # exchange, so one caller deadline bounds the driver's own waits (ummanu/board/sql_cards.py).
    "psycopg[binary]>=3.3.6",
    # The board store's schema is SQLAlchemy models and its migrations are Alembic's, by the
    # owner's decision of 2026-09-07 (docs/BOARD_STORE.md §7.4). Both are core for the same
    # reason the driver is: an installation that cannot build or verify its own
    # schema cannot serve the board at all. 2.0 is the first SQLAlchemy with the declarative
    # and `Identity`/`Computed` surface board/schema.py uses; 1.13 is the Alembic that speaks
    # it. Floors, not equality pins, like everything above except ruff.
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.4",
]
ci = [
    "coverage>=7.6",
    # The real pytest selector fixture runs only in CI; the product adds no runner dependency.
    "pytest>=9,<10",
]
typecheck = [
    "mypy==1.18.2",
]
memory = [
    "mcp==1.28.1",
    "fastembed==0.8.0",
    "sqlite-vec==0.1.9",
    "numpy==2.4.6",
]

[project.scripts]
ummanu = "ummanu.cli:main"
ummanu-memory-mcp = "ummanu.memory_service:main"
ummanu-memory-po-bridge = "ummanu.memory.po_bridge:main"
ummanu-memory-reindex = "ummanu.memory_reindex:main"

[tool.ummanu]
# Where this product ships its background agents' `<agent>/automation.toml` specs. `ummanu`
# reads the location from here (automations, role worktrees) rather than naming the agents'
# package: `ummanu.automations` is built on top of the rest of `ummanu`, never the other
# way round.
agent-specs = "src/ummanu/automations/agents"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ummanu*"]

[tool.setuptools.package-data]
"ummanu.schemas" = ["*.json"]
# Alembic reads its environment, template and revisions from the installed tree by path, so
# they ship with the package rather than only existing in the checkout.
"ummanu.board.migrations" = ["script.py.mako", "versions/*.py"]
"ummanu.runtime" = ["heads.toml", "docker-bin/docker"]
"ummanu.automations.agents.curator" = ["*.toml"]
"ummanu.automations.agents.pipeline" = ["*.toml"]
"ummanu.automations.agents.retro" = ["*.toml"]
"ummanu.automations.agents.steward" = ["*.toml"]

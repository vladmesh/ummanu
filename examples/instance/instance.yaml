# Example instance config. No live bindings — safe to commit to the product repo.
version: 1
name: example-ummanu
description: Example installation used by doctor --dry-run and schema tests.
data_dir: /var/lib/ummanu-data
offsite:
  instance_remote: git@example.invalid:example/secretary-instance.git
persona:
  name: example-operator
  style: terse
heads:
  - role: worker
    model: example-worker-model
  - role: reviewer
    model: example-reviewer-model
host:
  projects_root: /srv/projects
  unit_prefix: ummanu-
  units:
    - ummanu-pipeline.service
    - ummanu-curator.timer
  # Components this installation deliberately does not run. Anything the product
  # ships and this block does not name is enabled.
  components:
    retro:
      enabled: false
      reason: example installation has nothing to reflect on
  # Names under unit_prefix owned by something else. Without an entry here an
  # unrecognised unit in our namespace is a conflict and apply refuses to write.
  foreign_units:
    - ummanu-supervisor.timer
  # One inference request must leave CPU for the minute dispatcher tick.
  memory_threads: 1
